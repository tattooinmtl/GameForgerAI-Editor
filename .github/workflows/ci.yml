name: GameForgerAI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Windows x64 MSVC ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # This step used ashley-taylor/setup-ninja, whose repository has since
      # been removed from GitHub - every run then failed at "Set up job" in
      # about three seconds, without compiling anything. Rather than swap in
      # another third-party action (the obvious candidate is archived, i.e.
      # the same failure waiting to happen), resolve Ninja from what the
      # runner already has and fall back to Chocolatey, which is preinstalled
      # on GitHub's Windows images. No external action to rot.
      - name: Setup Ninja
        shell: pwsh
        run: |
          if (Get-Command ninja -ErrorAction SilentlyContinue) {
            Write-Host "Ninja already on PATH: $((Get-Command ninja).Source)"
          } else {
            Write-Host "Ninja not found; installing via Chocolatey."
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure CMake
        run: |
          cmake --preset windows-x64

      - name: Build All Targets
        run: |
          cmake --build out/build/windows-x64 --config ${{ matrix.config }}

      - name: Run Automated CTest Suite
        run: |
          ctest --test-dir out/build/windows-x64 -C ${{ matrix.config }} --output-on-failure
